name: VPT009 individual test build
on:
  push:
    branches: ['test/vpt009-individual-build']
    paths: ['.github/workflows/vpt009-individual-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned candidate and seal individual test copy
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/pccs/build_arm9_probe.sh
          command -v openssl
          cat >> experiments/pccs/build_arm9_probe.sh <<'SEAL'
          test -s PKTool.nds
          mkdir -p "$GITHUB_WORKSPACE/sealed-test"
          out="$GITHUB_WORKSPACE/sealed-test"
          cat > "$work/recipient.pem" <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAqqy1loS0iJfwv7oJ0+hJ
          MXLVj9sNM+lEXqexdNFY22dm3bgKuxkiB8RED1KauxWnOzIrNmeSlhzGRweSEjAX
          rvsXRGSHZgNM3FplsLpPQRpUuzft1WJvnJt8D5OBhPnvMCXV5twSc+IfMgRStBn3
          9U8rLTLDHa8eegpOIzKaBe3XXscrn7vZ8WbiD+rRsyMK56XPPlYoXlHAISI25ZtL
          CuFe4D/UidZuxnEEZsWdYs1hk24E3SEjLQqosQI+SfUwlWFqd5BZIIPn0hda2AKt
          ynKNBSlcyvimgNERniuYC3ZGCxOojq3sVA9WAlO0O5jj7dh+DWgXVJedCOcwRBkI
          9wIDAQAB
          -----END PUBLIC KEY-----
          PUBKEY
          openssl rand -hex 32 > "$work/session-key"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass "file:$work/session-key" -in PKTool.nds -out "$out/PKTool-VPT009.nds.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$work/recipient.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$work/session-key" -out "$out/session-key.enc"
          sha256sum PKTool.nds | tee "$out/SHA256SUMS.txt"
          SEAL
          bash experiments/pccs/build_arm9_probe.sh
          test ! -e PKTool.nds
          test ! -e PKTool.elf
          test -s sealed-test/PKTool-VPT009.nds.enc
          test -s sealed-test/session-key.enc
      - uses: actions/upload-artifact@v4
        with:
          name: VPT009-individual-sealed-test
          path: sealed-test/
          retention-days: 1
          if-no-files-found: error
