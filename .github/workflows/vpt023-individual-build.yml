name: VPT023 individual test build
on:
  push:
    branches: ['test/vpt023-individual-build']
    paths: ['.github/workflows/vpt023-individual-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned candidate and seal individual test copy
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/pccs/build_arm9_probe.sh
          command -v openssl
          cat >> experiments/pccs/build_arm9_probe.sh <<'SEAL'
          test -s PKTool.nds
          mkdir -p "$GITHUB_WORKSPACE/sealed-test"
          out="$GITHUB_WORKSPACE/sealed-test"
          cat > "$work/recipient.pem" <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEArlh7fw29dHzSRF/Nkeyo
          WqQo4iXj/5GE6koysG4aegndc6iPc+wcun1vgnpQQjvW+BPV0qWuFiausUocRy4j
          WT8yX6fnwUk0TOw5HiDrR5e0w5XgG8ef419sirX0YX4edqkVFsyQRBWcoonCFq7w
          va7s3zEBNDDsRDEG2k6Yrxh1i2ja/6JrfC+MJnYNryvmJQuSia8ZBVF0I/vmJ53A
          cxS2SF2UvTj7+YwFBZ6o6ufIypg2r+OYUODM9fLXOeYfEo3luwQsIYvunRkc1O63
          JTlu4/6HbecSntO7zGr89vh61qoAz3G1IMS/9zG8TwAg7m7hfpXqXqwX7eiteD9C
          AwIDAQAB
          -----END PUBLIC KEY-----
          PUBKEY
          openssl rand -hex 32 > "$work/session-key"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass "file:$work/session-key" -in PKTool.nds -out "$out/PKTool-VPT023.nds.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$work/recipient.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$work/session-key" -out "$out/session-key.enc"
          sha256sum PKTool.nds | tee "$out/SHA256SUMS.txt"
          SEAL
          bash experiments/pccs/build_arm9_probe.sh
          test ! -e PKTool.nds
          test ! -e PKTool.elf
          test -s sealed-test/PKTool-VPT023.nds.enc
          test -s sealed-test/session-key.enc
      - uses: actions/upload-artifact@v4
        with:
          name: VPT023-individual-sealed-test
          path: sealed-test/
          retention-days: 1
          if-no-files-found: error
