name: VPT020 individual test build
on:
  push:
    branches: ['test/vpt020-individual-build']
    paths: ['.github/workflows/vpt020-individual-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned candidate and seal individual test copy
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/pccs/build_arm9_probe.sh
          command -v openssl
          cat >> experiments/pccs/build_arm9_probe.sh <<'SEAL'
          test -s PKTool.nds
          mkdir -p "$GITHUB_WORKSPACE/sealed-test"
          out="$GITHUB_WORKSPACE/sealed-test"
          cat > "$work/recipient.pem" <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAxm9Hzm1bDNyDrqgzUFzg
          owebb1ZKeypL0kJIooTzEWsohNR9A0D/UWTonrRP8ClbR5gA8pQN9YxVeii/xCjX
          7/xS5a81PcbzIUYtFKwxYA2rygW/APP8MehjEGz+uvqOU2lRUyE1KeQIDIsmOI59
          8B4M5V5XB4T9PIuqF2yQprQpw0L4+ua/jAckvT5wbqwM9rRnX7qJx/cuysUcCT1/
          jfUtvEzft59Iq9LBYRemKz5r5c7sGz7CIyZoqaIbDTEBlK3/W0iTnYPtE1GZVrLp
          aRPTx3W2zXVr/6HQ0rRJ91/C0V+8RRGGIyGOKFWSICaAVM4jRSV8mbABbUwapULK
          qwIDAQAB
          -----END PUBLIC KEY-----
          PUBKEY
          openssl rand -hex 32 > "$work/session-key"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass "file:$work/session-key" -in PKTool.nds -out "$out/PKTool-VPT020.nds.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$work/recipient.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$work/session-key" -out "$out/session-key.enc"
          sha256sum PKTool.nds | tee "$out/SHA256SUMS.txt"
          SEAL
          bash experiments/pccs/build_arm9_probe.sh
          test ! -e PKTool.nds
          test ! -e PKTool.elf
          test -s sealed-test/PKTool-VPT020.nds.enc
          test -s sealed-test/session-key.enc
      - uses: actions/upload-artifact@v4
        with:
          name: VPT020-individual-sealed-test
          path: sealed-test/
          retention-days: 1
          if-no-files-found: error
