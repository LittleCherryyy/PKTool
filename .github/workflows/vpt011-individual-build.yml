name: VPT011 individual test build
on:
  push:
    branches: ['test/vpt011-individual-build']
    paths: ['.github/workflows/vpt011-individual-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned candidate and seal individual test copy
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/pccs/build_arm9_probe.sh
          command -v openssl
          cat >> experiments/pccs/build_arm9_probe.sh <<'SEAL'
          test -s PKTool.nds
          mkdir -p "$GITHUB_WORKSPACE/sealed-test"
          out="$GITHUB_WORKSPACE/sealed-test"
          cat > "$work/recipient.pem" <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAr/OUNmRgnnsY2WDxXhfO
          XGQVfKQSd8d7LmIgfXEZ2iDynG75koFjzNk21v1IG+28HYyMudgQUQY8boZSFfzN
          QHhLr/PRQcm9G2w38aKQXlmrpS4qa8ey3EoJOwVCQKBgl/1wKFwHXf081QNoyhm/
          3wYcnOJH0gxItUtEmqIabKTGlMYQTd7WfAPUn8Ze+qUQMHNgZPl9sobYdAPVi8jg
          pBEH3AFJv85ifnaWgQ6GB5IBVQuQHciK3MIDp8aASVKgoY8If8+sZDmrxYwCMPhS
          A9rXV2eYXulBAY4cvWWTPm/rvw9Xhe0QULIS1PbFnMcWLgxWjvvuSc6iaz7eNm6Y
          dQIDAQAB
          -----END PUBLIC KEY-----
          PUBKEY
          openssl rand -hex 32 > "$work/session-key"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass "file:$work/session-key" -in PKTool.nds -out "$out/PKTool-VPT011.nds.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$work/recipient.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$work/session-key" -out "$out/session-key.enc"
          sha256sum PKTool.nds | tee "$out/SHA256SUMS.txt"
          SEAL
          bash experiments/pccs/build_arm9_probe.sh
          test ! -e PKTool.nds
          test ! -e PKTool.elf
          test -s sealed-test/PKTool-VPT011.nds.enc
          test -s sealed-test/session-key.enc
      - uses: actions/upload-artifact@v4
        with:
          name: VPT011-individual-sealed-test
          path: sealed-test/
          retention-days: 1
          if-no-files-found: error
