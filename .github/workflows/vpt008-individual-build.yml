name: VPT008 individual test build
on:
  push:
    branches: ['test/vpt008-individual-build']
    paths: ['.github/workflows/vpt008-individual-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned candidate and seal individual test copy
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/pccs/build_arm9_probe.sh
          command -v openssl
          cat >> experiments/pccs/build_arm9_probe.sh <<'SEAL'
          test -s PKTool.nds
          mkdir -p "$GITHUB_WORKSPACE/sealed-test"
          out="$GITHUB_WORKSPACE/sealed-test"
          cat > "$work/recipient.pem" <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAnzn5+TrVCnqScTemVUse
          CsbENDYuxRiqPYBWmJvlKZGt8lipCLljC7kF7VUAdiYms/a/cQv+6SLgs4nSrinn
          3Pvc6FLU0azx3Gbr8qK2Uvi/Jy8U1N0WCqPeGyiD6cPRCmwqE+PG1CGJVyZ+iD70
          dRxU9Wlg4utPxogBz2x0gfrUo2URMP0u57XUhV2mzkUSjf9X+5HPWlfQFB7Q1msn
          kO5Sv9xiwrH85D2e4XomewP5eZNnd17dQZd/vzyA4/Yd1LrIEHbE+klHTpzu/bbB
          OzE8RugM7Nit4/9ihG9E9rloQDuaSkYKjt4mG6kruGISfKXleArsROEPiLGm7e4L
          8wIDAQAB
          -----END PUBLIC KEY-----
          PUBKEY
          openssl rand -hex 32 > "$work/session-key"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass "file:$work/session-key" -in PKTool.nds -out "$out/PKTool-VPT008.nds.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$work/recipient.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$work/session-key" -out "$out/session-key.enc"
          sha256sum PKTool.nds | tee "$out/SHA256SUMS.txt"
          SEAL
          bash experiments/pccs/build_arm9_probe.sh
          test ! -e PKTool.nds
          test ! -e PKTool.elf
          test -s sealed-test/PKTool-VPT008.nds.enc
          test -s sealed-test/session-key.enc
      - uses: actions/upload-artifact@v4
        with:
          name: VPT008-individual-sealed-test
          path: sealed-test/
          retention-days: 1
          if-no-files-found: error
