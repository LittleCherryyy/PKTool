name: VPT002 PCCS conversion probe
on:
  push:
    branches: ['dev/vpt001-pccs', 'dev/vpt028-bank-box-history', 'dev/vpt030-link-experience', 'dev/vpt031-edition-sprites', 'dev/vpt032-link-transformer', 'dev/vpt033-render-memory', 'dev/vpt034-visual-regression', 'dev/vpt035-private-test-build']
    paths: ['experiments/pccs/**', 'ds/app/**', 'ds/gfx/**', 'tests/test_transport_sprite_packs.cpp', 'tools/build_transport_sprites.py', '.github/workflows/vpt002-conversion.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check VPT035 private builder refuses CI and uploads nothing
        run: |
          bash -n experiments/pccs/build_private_candidate.sh
          if CI=true DEVKITARM=/no-compiler bash experiments/pccs/build_private_candidate.sh "$RUNNER_TEMP/never.nds"; then
            echo "ERROR: private builder unexpectedly ran in CI"; exit 1
          fi
          test ! -e "$RUNNER_TEMP/never.nds"
      - name: Fetch pinned upstream library (test-only, no distribution)
        run: |
          git clone --no-checkout https://github.com/Striaton-Lab-Team/Pokemon-Community-Conversion-Standard.git "$RUNNER_TEMP/pccs"
          git -C "$RUNNER_TEMP/pccs" checkout --detach 9cd6bc9bd1250013ceb1b1a70d96569985a87543
          test "$(git -C "$RUNNER_TEMP/pccs" rev-parse HEAD)" = 9cd6bc9bd1250013ceb1b1a70d96569985a87543
      - name: Build upstream host library and data tables
        run: |
          python3 experiments/pccs/fix_upstream_charset.py "$RUNNER_TEMP/pccs"
          python3 experiments/pccs/fix_upstream_statexp.py "$RUNNER_TEMP/pccs"
          make -C "$RUNNER_TEMP/pccs" -j2
      - name: Build PKTool portable core
        run: |
          cmake -S . -B build-vpt -DCMAKE_BUILD_TYPE=Release
          cmake --build build-vpt --target pktool_core -j2
      - name: Test historical artwork manifest and PKS1 converter offline
        run: python3 experiments/pccs/test_transport_sprites.py
      - name: Test visual edition resolver
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -I. experiments/pccs/test_transport_visual.cpp build-vpt/libpktool_core.a -o "$RUNNER_TEMP/vpt030-visual"
          "$RUNNER_TEMP/vpt030-visual"
      - name: Compile real read-only conversion probe
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -I. -I"$RUNNER_TEMP/pccs/include" -I"$RUNNER_TEMP/pccs/lib/include" \
            experiments/pccs/pccs_bridge.cpp experiments/pccs/test_conversion.cpp \
            build-vpt/libpktool_core.a "$RUNNER_TEMP/pccs/lib/libpccs.a" -o "$RUNNER_TEMP/vpt002"
      - name: Run conversion and legality tests (bounded time)
        run: timeout 180s stdbuf -oL "$RUNNER_TEMP/vpt002"
      - name: Compile staged save transfer test
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -I. -I"$RUNNER_TEMP/pccs/include" -I"$RUNNER_TEMP/pccs/lib/include" \
            experiments/pccs/pccs_bridge.cpp experiments/pccs/stage_transfer.cpp experiments/pccs/test_stage_transfer.cpp \
            build-vpt/libpktool_core.a "$RUNNER_TEMP/pccs/lib/libpccs.a" -o "$RUNNER_TEMP/vpt004"
      - name: Test in-memory Crystal and Ruby save round-trip
        run: |
          mkdir -p "$RUNNER_TEMP/pk3-audit"
          VPT_PK3_AUDIT_DIR="$RUNNER_TEMP/pk3-audit" timeout 180s stdbuf -oL "$RUNNER_TEMP/vpt004"
      - name: Compile POSIX journal and recovery test
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -I. -I"$RUNNER_TEMP/pccs/include" -I"$RUNNER_TEMP/pccs/lib/include" \
            experiments/pccs/pccs_bridge.cpp experiments/pccs/stage_transfer.cpp experiments/pccs/transfer_journal.cpp experiments/pccs/test_transfer_journal.cpp \
            build-vpt/libpktool_core.a "$RUNNER_TEMP/pccs/lib/libpccs.a" -o "$RUNNER_TEMP/vpt005"
      - name: Test destination-first persistence and interruption recovery
        run: timeout 180s stdbuf -oL "$RUNNER_TEMP/vpt005"
      - name: Compile experimental FAT backend host simulation
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -DVPT_FAT_TEST -I. -I"$RUNNER_TEMP/pccs/include" -I"$RUNNER_TEMP/pccs/lib/include" \
            experiments/pccs/pccs_bridge.cpp experiments/pccs/stage_transfer.cpp experiments/pccs/transfer_journal.cpp experiments/pccs/test_transfer_journal.cpp \
            build-vpt/libpktool_core.a "$RUNNER_TEMP/pccs/lib/libpccs.a" -o "$RUNNER_TEMP/vpt006"
      - name: Test FAT path policy and journal state machine on host
        run: timeout 180s stdbuf -oL "$RUNNER_TEMP/vpt006"
      - name: Compile exact review persistence test
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -I. -I"$RUNNER_TEMP/pccs/include" -I"$RUNNER_TEMP/pccs/lib/include" \
            experiments/pccs/pccs_bridge.cpp experiments/pccs/stage_transfer.cpp experiments/pccs/transfer_journal.cpp experiments/pccs/test_reviewed_transfer.cpp \
            build-vpt/libpktool_core.a "$RUNNER_TEMP/pccs/lib/libpccs.a" -o "$RUNNER_TEMP/vpt006c"
      - name: Verify reviewed bytes and stale save rejection
        run: timeout 180s stdbuf -oL "$RUNNER_TEMP/vpt006c"
      - name: Build optional transporter UI for host integration tests
        run: |
          cmake -S . -B build-vpt-ui -DCMAKE_BUILD_TYPE=Release '-DCMAKE_CXX_FLAGS=-DVPT_TRANSPORTER_PREVIEW -DVPT_TRANSPORTER_WRITE'
          cmake --build build-vpt-ui --target pktool_ui -j2
      - name: Link and run end-to-end UI test
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -DVPT_TRANSPORTER_PREVIEW -DVPT_TRANSPORTER_WRITE -I. -I"$RUNNER_TEMP/pccs/include" -I"$RUNNER_TEMP/pccs/lib/include" \
            experiments/pccs/pccs_bridge.cpp experiments/pccs/stage_transfer.cpp experiments/pccs/transfer_journal.cpp experiments/pccs/test_transporter_ui.cpp \
            build-vpt-ui/libpktool_ui.a build-vpt-ui/libpktool_core.a "$RUNNER_TEMP/pccs/lib/libpccs.a" -o "$RUNNER_TEMP/vpt007-ui"
          timeout 180s stdbuf -oL "$RUNNER_TEMP/vpt007-ui"
      - name: Set up independent PKHeX audit runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch pinned PKHeX source
        run: |
          git clone --no-checkout https://github.com/kwsch/PKHeX.git "$RUNNER_TEMP/pkhex"
          git -C "$RUNNER_TEMP/pkhex" checkout --detach bfe89c74a3f5265805e364b79bc04ad38ebbc5ea
          test "$(git -C "$RUNNER_TEMP/pkhex" rev-parse HEAD)" = bfe89c74a3f5265805e364b79bc04ad38ebbc5ea
      - name: Independent PKHeX audit (strict regression gate)
        shell: bash
        run: |
          set -o pipefail
          PKHeXRoot="$RUNNER_TEMP/pkhex" dotnet run --project experiments/pccs/pkhex-audit/Audit.csproj -c Release -- "$RUNNER_TEMP/pk3-audit" | tee "$RUNNER_TEMP/pkhex-report.txt"
      - name: Preserve synthetic audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkhex-synthetic-report
          path: |
            ${{ runner.temp }}/pkhex-report.txt
            ${{ runner.temp }}/pk3-audit/*.refused.txt
          if-no-files-found: warn
