name: VPT015 individual test build
on:
  push:
    branches: ['test/vpt015-individual-build']
    paths: ['.github/workflows/vpt015-individual-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned candidate and seal individual test copy
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/pccs/build_arm9_probe.sh
          command -v openssl
          cat >> experiments/pccs/build_arm9_probe.sh <<'SEAL'
          test -s PKTool.nds
          mkdir -p "$GITHUB_WORKSPACE/sealed-test"
          out="$GITHUB_WORKSPACE/sealed-test"
          cat > "$work/recipient.pem" <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAvM5KI8JbIutZXsivzePP
          +rui7AvMNyzGTCp8PLi8ZSiLLNeu4hFpRddbeaa1vTEW4XLW1R8sQpMUu+EowVvh
          HhevoVHfPSPUaWdQQapFCa51CI82aEuNK1YG7dHu0wJqM2IgaIbbk3Fa/6kKNZlF
          OzuIV5W6FuFyBr9xYmj+wkcoKkY1/iSmdSsrwvuypTffSGxvM5nJ9NcFiFpYVZKG
          YTdJHLGer85l1nm/C7EzXXMLAcGjxt+CV9+ZZEc53N6kKUy5x5GCbvnfqA0A5YtU
          N45nb5AoQVTgvmTys9TEd0KDK7MaOEoQjYl5nQbcydsRMBVAcI646Ew16P0japLn
          yQIDAQAB
          -----END PUBLIC KEY-----
          PUBKEY
          openssl rand -hex 32 > "$work/session-key"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass "file:$work/session-key" -in PKTool.nds -out "$out/PKTool-VPT015.nds.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$work/recipient.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$work/session-key" -out "$out/session-key.enc"
          sha256sum PKTool.nds | tee "$out/SHA256SUMS.txt"
          SEAL
          bash experiments/pccs/build_arm9_probe.sh
          test ! -e PKTool.nds
          test ! -e PKTool.elf
          test -s sealed-test/PKTool-VPT015.nds.enc
          test -s sealed-test/session-key.enc
      - uses: actions/upload-artifact@v4
        with:
          name: VPT015-individual-sealed-test
          path: sealed-test/
          retention-days: 1
          if-no-files-found: error
