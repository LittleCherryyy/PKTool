name: VPT006 ARM9 build-only probe
on:
  push:
    branches: ['dev/vpt001-pccs', 'dev/vpt028-bank-box-history', 'dev/vpt030-link-experience', 'dev/vpt031-edition-sprites', 'dev/vpt032-link-transformer', 'dev/vpt033-render-memory', 'dev/vpt034-visual-regression']
    paths: ['experiments/pccs/**', 'ds/app/**', 'ds/gfx/**', 'tests/test_transport_sprite_packs.cpp', 'tools/build_transport_sprites.py', '.github/workflows/vpt003-arm9-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm9:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build and link ARM9 probe in disposable checkout
        run: bash experiments/pccs/build_arm9_probe.sh
