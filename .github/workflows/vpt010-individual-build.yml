name: VPT010 individual test build
on:
  push:
    branches: ['test/vpt010-individual-build']
    paths: ['.github/workflows/vpt010-individual-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned candidate and seal individual test copy
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/pccs/build_arm9_probe.sh
          command -v openssl
          cat >> experiments/pccs/build_arm9_probe.sh <<'SEAL'
          test -s PKTool.nds
          mkdir -p "$GITHUB_WORKSPACE/sealed-test"
          out="$GITHUB_WORKSPACE/sealed-test"
          cat > "$work/recipient.pem" <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAqp8f9MUso88wdbukuITn
          S4Oj0PrhQCtKsdxHkl4c6ENphwlGuFfFKKMeqn/gFBLOMjrLAsxpGiliAttX75Os
          q3TMsiIGM0/9p7ACttll8zRyl/foK4iDsRBqOAolLToNyBIOHE1Ku3PWJWdQoKNb
          OO7+re62GpXvzQrB6IOCEO1BZwZ2xQVrN0dA1wjPt5DgP3i4CqiS9YMA0m4tA3fK
          W5eStakHQYdBI/Z8Qmgbxg6rS+U1MMWwvj/cGsrKxq6FMwPBrHt+EOG9luI9WtJK
          T1ozPKlAb620dDHJBlBKOSd8kb/VfhbpxB2eKm+kqcJ2jQojoQVMQLDtaSQ42X0Q
          bQIDAQAB
          -----END PUBLIC KEY-----
          PUBKEY
          openssl rand -hex 32 > "$work/session-key"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass "file:$work/session-key" -in PKTool.nds -out "$out/PKTool-VPT010.nds.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$work/recipient.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$work/session-key" -out "$out/session-key.enc"
          sha256sum PKTool.nds | tee "$out/SHA256SUMS.txt"
          SEAL
          bash experiments/pccs/build_arm9_probe.sh
          test ! -e PKTool.nds
          test ! -e PKTool.elf
          test -s sealed-test/PKTool-VPT010.nds.enc
          test -s sealed-test/session-key.enc
      - uses: actions/upload-artifact@v4
        with:
          name: VPT010-individual-sealed-test
          path: sealed-test/
          retention-days: 1
          if-no-files-found: error
