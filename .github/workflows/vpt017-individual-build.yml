name: VPT017 individual test build
on:
  push:
    branches: ['test/vpt017-individual-build']
    paths: ['.github/workflows/vpt017-individual-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned candidate and seal individual test copy
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/pccs/build_arm9_probe.sh
          command -v openssl
          cat >> experiments/pccs/build_arm9_probe.sh <<'SEAL'
          test -s PKTool.nds
          mkdir -p "$GITHUB_WORKSPACE/sealed-test"
          out="$GITHUB_WORKSPACE/sealed-test"
          cat > "$work/recipient.pem" <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA2toP/GnZSiy2yLTUET9U
          NX0F3lDabk/EWQfswZRStj27IKjOdOsChUM2c0zoy/6Zek1jtnb91RZ4Abhm9xhN
          zeHsOPDFcnTFNboMACb5TZCZ3nOs+XDYDzuzrLZTfDJtUlbUnzRBnygy9vfriHvQ
          jzf1rAH49NBUzgK5N0hz7nyfuuZR0muawywBuM7BFZbFTyGOs4u5HmrpGuLHrdWF
          YOucrT6mCTQgGv//t+1NqSlM2bc0uFDTWywvEthtN9vXlXcCoR+FBbCT3ee91qoi
          YRYv2sUXg8gcR1Cmf7J5HFtofR8BHLQ2UYN3b4r3FEhFiBqRnXVPTFwDVPie8cUN
          1QIDAQAB
          -----END PUBLIC KEY-----
          PUBKEY
          openssl rand -hex 32 > "$work/session-key"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass "file:$work/session-key" -in PKTool.nds -out "$out/PKTool-VPT017.nds.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$work/recipient.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$work/session-key" -out "$out/session-key.enc"
          sha256sum PKTool.nds | tee "$out/SHA256SUMS.txt"
          SEAL
          bash experiments/pccs/build_arm9_probe.sh
          test ! -e PKTool.nds
          test ! -e PKTool.elf
          test -s sealed-test/PKTool-VPT017.nds.enc
          test -s sealed-test/session-key.enc
      - uses: actions/upload-artifact@v4
        with:
          name: VPT017-individual-sealed-test
          path: sealed-test/
          retention-days: 1
          if-no-files-found: error
