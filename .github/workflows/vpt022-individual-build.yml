name: VPT022 individual test build
on:
  push:
    branches: ['test/vpt022-individual-build']
    paths: ['.github/workflows/vpt022-individual-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned candidate and seal individual test copy
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/pccs/build_arm9_probe.sh
          command -v openssl
          cat >> experiments/pccs/build_arm9_probe.sh <<'SEAL'
          test -s PKTool.nds
          mkdir -p "$GITHUB_WORKSPACE/sealed-test"
          out="$GITHUB_WORKSPACE/sealed-test"
          cat > "$work/recipient.pem" <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA1JWGjqqaULAnzQ/INnUo
          kqXR+t3CzYvTKV3lT6A5c0G7wKSJLLN5jg7QSmXX9oXeO0jxxvUF2hdzOuOofI0k
          fij8tcI/F7ZSONSchisUzWyVLsDPMg/C9A3YJCUOB1KTYBVI+eoUwJEZbypdDDwD
          1yyX7naFHdctHrCZJU9kSkd1LHxv05Y5A8Pb9tE7w7p9VrsiMcyTCWTIsE3WWpRo
          HTm4Nx5hN0PJpncOVPcLAP6szUVb0SMaReDj5SPLz9av0TXOB1Eo33gdE8RFCrqz
          I10pauiV5cvgFbhwmgtH++iA8Tih1IXUEElDcCsf7AanrSkEw4SlKPgE122XySwt
          dQIDAQAB
          -----END PUBLIC KEY-----
          PUBKEY
          openssl rand -hex 32 > "$work/session-key"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass "file:$work/session-key" -in PKTool.nds -out "$out/PKTool-VPT022.nds.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$work/recipient.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$work/session-key" -out "$out/session-key.enc"
          sha256sum PKTool.nds | tee "$out/SHA256SUMS.txt"
          SEAL
          bash experiments/pccs/build_arm9_probe.sh
          test ! -e PKTool.nds
          test ! -e PKTool.elf
          test -s sealed-test/PKTool-VPT022.nds.enc
          test -s sealed-test/session-key.enc
      - uses: actions/upload-artifact@v4
        with:
          name: VPT022-individual-sealed-test
          path: sealed-test/
          retention-days: 1
          if-no-files-found: error
