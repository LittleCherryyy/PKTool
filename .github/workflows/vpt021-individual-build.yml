name: VPT021 individual test build
on:
  push:
    branches: ['test/vpt021-final-build']
    paths: ['.github/workflows/vpt021-individual-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned candidate and seal individual test copy
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/pccs/build_arm9_probe.sh
          command -v openssl
          cat >> experiments/pccs/build_arm9_probe.sh <<'SEAL'
          test -s PKTool.nds
          mkdir -p "$GITHUB_WORKSPACE/sealed-test"
          out="$GITHUB_WORKSPACE/sealed-test"
          cat > "$work/recipient.pem" <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAyM17Sc9Z/7HIUFXqbR7q
          8jSZrnOIMgvuwJOVO8sufKGnyQFfYwVnlP0ynZST4Git6E1VcMXl/+YhWEivAhWV
          OU8VOgMTOasqqNCr0XyO6v4MLZk3kkj+NpTKERZQtnmjxl2PwSxDzABBTHv2ca85
          AvqFXBQ6MHnKKxMxVuHLtJcW/RZZaww19VI9+25+V93RRBKqwWXzj3aj6deExtFy
          sgDYwGWNDzRbwVtAW6fOI4t6wz4yA0FrPSU6BiY+sqMa22d0zWPLIE6pLVQ4LEjK
          qy7N5N67uTIlh37i1VLlt+9lhKPx2q81lu0Lya9IF3EeGuOZpBLgLM5SIq3Bda5+
          gwIDAQAB
          -----END PUBLIC KEY-----
          PUBKEY
          openssl rand -hex 32 > "$work/session-key"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass "file:$work/session-key" -in PKTool.nds -out "$out/PKTool-VPT021.nds.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$work/recipient.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$work/session-key" -out "$out/session-key.enc"
          sha256sum PKTool.nds | tee "$out/SHA256SUMS.txt"
          SEAL
          bash experiments/pccs/build_arm9_probe.sh
          test ! -e PKTool.nds
          test ! -e PKTool.elf
          test -s sealed-test/PKTool-VPT021.nds.enc
          test -s sealed-test/session-key.enc
      - uses: actions/upload-artifact@v4
        with:
          name: VPT021-individual-sealed-test
          path: sealed-test/
          retention-days: 1
          if-no-files-found: error
